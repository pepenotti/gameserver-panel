# Game server panel: the panel, the orchestrator that creates the game
# servers' containers, and Caddy for HTTPS (HST-01).
#   node scripts/init-env.mjs              # once: creates .env with fresh secrets
#   docker compose build steam             # the image game servers run (a build-only service)
#   docker compose up -d --build
# In a development worktree, never call docker compose directly: use
#   node scripts/worktree-env.mjs --slot N
#   node scripts/stack.mjs build steam steam-fake    then    node scripts/stack.mjs up -d --build
#
# Published ports: the panel on ${PANEL_PORT} (HTTPS), and each game server's
# own ports (inside ORCH_HOST_PORTS), all bound to ${PUBLISH_ADDR} (default:
# every address). Nothing else leaves the host: the panel and the
# orchestrator listen only on unix sockets in volumes, and the orchestrator
# has no network at all (NFR-03).
name: gameserver-panel

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  # The only container with Docker access (D3, NFR-02). It creates each game
  # server's container, volumes and network from the panel's specs, names and
  # labels them after this Compose project, and touches nothing else.
  orchestrator:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile
    image: gsp/orchestrator:${IMAGE_TAG:-local}
    # Root without capabilities: the Docker socket belongs to root (see its Dockerfile).
    user: "0:0"
    read_only: true
    network_mode: none
    environment:
      ORCH_TOKEN: ${ORCH_TOKEN:?run node scripts/init-env.mjs first}
      ORCH_SOCKET: /run/orch/orch.sock
      ORCH_HOST_PORTS: ${ORCH_HOST_PORTS:?set ORCH_HOST_PORTS in .env (the host ports game servers may publish)}
      ORCH_MAX_MEM_MB: ${ORCH_MAX_MEM_MB:-16384}
      ORCH_MAX_SERVERS: ${ORCH_MAX_SERVERS:-10}
      ORCH_ALLOW_FAKE: ${ORCH_ALLOW_FAKE:-0}
      # Game servers publish their ports where the panel's port is published.
      ORCH_PUBLISH_ADDR: ${PUBLISH_ADDR:-}
    volumes:
      # Read-write: creating containers is its job (and a :ro socket mount restricts nothing).
      - /var/run/docker.sock:/var/run/docker.sock
      - orch-sock:/run/orch
    mem_limit: 128m

  panel:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/panel/Dockerfile
    image: gsp/panel:${IMAGE_TAG:-local}
    read_only: true
    tmpfs: [/tmp]
    environment:
      # Only on its socket, which only Caddy also mounts (NFR-03).
      PANEL_LISTEN: unix:/run/panel/panel.sock
      ORCH_SOCKET: /run/orch/orch.sock
      ORCH_TOKEN: ${ORCH_TOKEN:?run node scripts/init-env.mjs first}
      # The image variant new servers ask for: empty (real games) or fake (development slots).
      SERVER_IMAGE_VARIANT: ${SERVER_IMAGE_VARIANT:-}
      # The server this install had before the server list (`default`), until the
      # panel creates it through the orchestrator too.
      AGENT_TOKEN: ${AGENT_TOKEN:?run node scripts/init-env.mjs first}
      PZ_SERVER_NAME: ${PZ_SERVER_NAME:-zomboid}
      GAME_PORT_GAME: ${PZ_GAME_PORT:-16261}
      GAME_PORT_UDP: ${PZ_UDP_PORT:-16262}
      # The adapter's launch secrets, as GAME_SECRET_<KEY> (the key in upper snake case).
      GAME_SECRET_ADMIN_PASSWORD: ${PZ_ADMIN_PASSWORD:?run node scripts/init-env.mjs first}
      # Exactly the addresses people type; anything else is refused as cross-site.
      PANEL_ORIGINS: https://${PANEL_HOST:-localhost}:${PANEL_PORT:-8443},https://${LAN_IP:-127.0.0.1}:${PANEL_PORT:-8443},https://localhost:${PANEL_PORT:-8443}
      PANEL_OWNER_USERNAME: ${PANEL_OWNER_USERNAME:-}
      PANEL_OWNER_PASSWORD: ${PANEL_OWNER_PASSWORD:-}
      CLIENT_IP_TRUSTWORTHY: ${CLIENT_IP_TRUSTWORTHY:-false}
      TZ: ${TZ:-UTC}
    # No game volumes (D11): server files go through each server's agent.
    volumes:
      - panel-data:/var/lib/panel
      - panel-sock:/run/panel
      # Read-only is enough to connect to a socket.
      - orch-sock:/run/orch:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # Egress only (Discord, mod lookups); the orchestrator adds each server's network.
    networks: [panel]
    depends_on: [orchestrator]
    mem_limit: ${PANEL_MEM_LIMIT:-1g}

  caddy:
    <<: *hardening
    # caddy:2-alpine plus the DuckDNS DNS provider (for PANEL_TLS=duckdns).
    build: docker/caddy
    image: gsp/caddy:${IMAGE_TAG:-local}
    read_only: true
    # The official caddy binary carries this file capability; without it in
    # the bounding set the kernel refuses to run it at all.
    cap_add: [NET_BIND_SERVICE]
    environment:
      PANEL_HOST: ${PANEL_HOST:-localhost}
      LAN_IP: ${LAN_IP:-127.0.0.1}
      PANEL_PORT: ${PANEL_PORT:-8443}
      PANEL_TLS: ${PANEL_TLS:-internal}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    ports:
      - target: ${PANEL_PORT:-8443}
        published: "${PANEL_PORT:-8443}"
        protocol: tcp
        host_ip: ${PUBLISH_ADDR:-0.0.0.0}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The panel's socket (reverse_proxy unix//run/panel/panel.sock).
      - panel-sock:/run/panel:ro
      # Holds Caddy's local CA and certificates: keep it, or every device sees a new certificate.
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [panel]
    mem_limit: 256m

  # Build-only: the runtime images the orchestrator runs game servers from
  # (never started by Compose). Naming them builds them: docker compose build steam steam-fake
  steam:
    profiles: [images]
    build:
      context: .
      dockerfile: docker/steam/Dockerfile
      target: runtime
    image: gsp/steam:${IMAGE_TAG:-local}

  # The same with fake games instead of Steam: tests and development slots (ORCH_ALLOW_FAKE=1).
  steam-fake:
    profiles: [images]
    build:
      context: .
      dockerfile: docker/steam/Dockerfile
      target: fake
    image: gsp/steam-fake:${IMAGE_TAG:-local}

  # With PANEL_TLS=duckdns: keeps <DUCKDNS_SUBDOMAIN>.duckdns.org pointing at
  # this network's public IP (an empty ip= makes DuckDNS use the caller's).
  # Enabled by COMPOSE_PROFILES=duckdns in .env. Never prints the token.
  duckdns:
    <<: *hardening
    image: alpine:3
    profiles: [duckdns]
    read_only: true
    user: "65534:65534"
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    command:
      - sh
      - -c
      - |
        last=
        while true; do
          r=$$(wget -qO- "https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip=" 2>/dev/null) || r="no answer"
          [ "$$r" != "$$last" ] && echo "$$(date -Iseconds) DuckDNS update for $${DUCKDNS_SUBDOMAIN}: $$r"
          last=$$r
          sleep 300
        done
    mem_limit: 32m

  # Optional: a No-IP updater, for a PANEL_HOST on No-IP that nothing else
  # keeps pointing at this network.   docker compose --profile public up -d
  ddns:
    <<: *hardening
    image: ghcr.io/noipcom/noip-duc:3.1.1
    profiles: [public]
    environment:
      NOIP_USERNAME: ${NOIP_USERNAME:-}
      NOIP_PASSWORD: ${NOIP_PASSWORD:-}
      NOIP_HOSTNAMES: ${NOIP_HOSTNAMES:-all.ddnskey.com}
    mem_limit: 64m

networks:
  # Caddy's: where the HTTPS port is published.
  edge: {}
  # The panel's way out (Discord, mod lookups).
  panel: {}

volumes:
  panel-data:
  # The panel's socket: mounted by the panel and Caddy only.
  panel-sock:
  # The orchestrator's socket: mounted by the orchestrator and the panel only.
  orch-sock:
  caddy-data:
  caddy-config:
