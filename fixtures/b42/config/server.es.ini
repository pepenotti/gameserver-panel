# Desactiva la protección anti-trampas de suma de comprobación.
AntiCheatChecksum=2

# Establece el intervalo de actualización multijugador en segundos. Las estadísticas se desactivan si el valor es 0. Mínimo=0 Máximo=10 Por defecto=1
MultiplayerStatisticsPeriod=1

# Desactiva el marcador.
DisableScoreboard=false

# Oculta a los administradores en la lista de jugadores.
HideAdminsInPlayerList=false

# Establece el límite de paquetes de red que el servidor procesa por cada cliente. Mínimo=100 Máximo=1000 Por defecto=300
