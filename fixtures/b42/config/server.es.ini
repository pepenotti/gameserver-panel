BadWordPolicy=3

# Símbolo o texto que reemplazará la palabra prohibida
BadWordReplacement=[HIDDEN]

# Desactiva la protección anti-trampas del sistema de seguridad.
AntiCheatSafety=2

# Desactiva la protección anti-trampas de velocidad del personaje.
AntiCheatSpeed=2

# Desactiva la protección antitrampas contra no-clipping del personaje.
